<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420" viewBox="0 0 420 420">
  <!--
    Hand-drawn school motifs, tiled as the page ground. Original artwork, so
    there is no licence attached to it.

    The stroke is a pale green pitched to sit just above the page colour: the
    boxes on top are opaque, so this only ever shows in the gaps between them
    and must not compete with anything inside them.

    Motifs are placed so nothing crosses the tile edge, which keeps the repeat
    from showing a seam.
  -->
  <g fill="none" stroke="#c3d9c8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">

    <!-- pencil -->
    <g transform="translate(26 26) rotate(-20)">
      <path d="M0 0h34v11H0z"/><path d="M34 0l11 5.5L34 11z"/><path d="M0 0v11"/>
    </g>

    <!-- open book -->
    <g transform="translate(122 20)">
      <path d="M0 4c7-4 15-4 22 0v20c-7-4-15-4-22 0z"/>
      <path d="M22 4c7-4 15-4 22 0v20c-7-4-15-4-22 0z"/>
    </g>

    <!-- globe -->
    <g transform="translate(214 18)">
      <circle cx="14" cy="14" r="14"/><path d="M0 14h28M14 0c7 7 7 21 0 28M14 0C7 7 7 21 14 28"/>
    </g>

    <!-- flask -->
    <g transform="translate(300 16)">
      <path d="M6 0v10L0 26a4 4 0 0 0 4 5h14a4 4 0 0 0 4-5L16 10V0z"/><path d="M4 0h14"/><path d="M3 20h16"/>
    </g>

    <!-- paper plane -->
    <g transform="translate(370 24) rotate(12)">
      <path d="M0 8L30 0l-9 22-6-9z"/><path d="M15 13L30 0"/>
    </g>

    <!-- ruler -->
    <g transform="translate(20 108) rotate(8)">
      <path d="M0 0h46v14H0z"/><path d="M9 0v5M18 0v5M27 0v5M36 0v5"/>
    </g>

    <!-- backpack -->
    <g transform="translate(104 96)">
      <path d="M4 12a14 14 0 0 1 28 0v22a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z"/>
      <path d="M12 12a6 6 0 0 1 12 0"/><path d="M12 24h12v8H12z"/>
    </g>

    <!-- lightbulb -->
    <g transform="translate(184 100)">
      <path d="M10 22a10 10 0 1 1 8 0v5h-8z"/><path d="M10 31h8"/>
    </g>

    <!-- graduation cap -->
    <g transform="translate(252 104)">
      <path d="M0 9L20 0l20 9-20 9z"/><path d="M8 13v10c0 3 24 3 24 0V13"/>
    </g>

    <!-- clock -->
    <g transform="translate(330 100)">
      <circle cx="14" cy="14" r="14"/><path d="M14 6v9l6 4"/>
    </g>

    <!-- atom -->
    <g transform="translate(30 196)">
      <circle cx="16" cy="16" r="3.5"/>
      <ellipse cx="16" cy="16" rx="16" ry="6.5"/>
      <ellipse cx="16" cy="16" rx="16" ry="6.5" transform="rotate(60 16 16)"/>
      <ellipse cx="16" cy="16" rx="16" ry="6.5" transform="rotate(120 16 16)"/>
    </g>

    <!-- calculator -->
    <g transform="translate(114 194)">
      <rect x="0" y="0" width="26" height="34" rx="3"/><path d="M5 7h16"/>
      <path d="M6 16h2M12 16h2M18 16h2M6 24h2M12 24h2M18 24h2"/>
    </g>

    <!-- stack of books -->
    <g transform="translate(186 200)">
      <path d="M0 20h34v7H0zM3 13h34v7H3zM0 6h34v7H0z"/>
    </g>

    <!-- trophy -->
    <g transform="translate(268 194)">
      <path d="M6 0h16v10a8 8 0 0 1-16 0z"/><path d="M6 3H0a6 6 0 0 0 6 6M22 3h6a6 6 0 0 1-6 6"/>
      <path d="M14 18v7M8 27h12"/>
    </g>

    <!-- alarm bell -->
    <g transform="translate(340 196)">
      <path d="M4 20a10 10 0 0 1 20 0z"/><path d="M0 22h28"/><path d="M11 26a3 3 0 0 0 6 0"/>
      <path d="M14 4v6"/>
    </g>

    <!-- musical note -->
    <g transform="translate(28 286)">
      <path d="M8 26V4l16-3v22"/><ellipse cx="4" cy="27" rx="5" ry="4"/><ellipse cx="20" cy="24" rx="5" ry="4"/>
    </g>

    <!-- palette -->
    <g transform="translate(104 288)">
      <path d="M16 0a16 14 0 1 0 0 28c3 0 3-4 5-5s7 1 8-4A16 14 0 0 0 16 0z"/>
      <circle cx="9" cy="9" r="2"/><circle cx="17" cy="6" r="2"/><circle cx="24" cy="12" r="2"/>
    </g>

    <!-- magnifier -->
    <g transform="translate(186 290)">
      <circle cx="11" cy="11" r="11"/><path d="M19 19l9 9"/>
    </g>

    <!-- apple -->
    <g transform="translate(258 288)">
      <path d="M11 6C4 6 0 11 0 17c0 7 6 13 11 13s11-6 11-13c0-6-4-11-11-11z"/>
      <path d="M11 6V2M11 2c3-2 6-1 6-1"/>
    </g>

    <!-- rocket -->
    <g transform="translate(336 286)">
      <path d="M12 0c7 6 9 15 9 22l-9 6-9-6c0-7 2-16 9-22z"/><circle cx="12" cy="12" r="3.5"/>
      <path d="M3 22L0 30l6-3M21 22l3 8-6-3"/>
    </g>

    <!-- speech bubble -->
    <g transform="translate(36 366)">
      <path d="M0 4a4 4 0 0 1 4-4h26a4 4 0 0 1 4 4v14a4 4 0 0 1-4 4H12l-8 7v-7a4 4 0 0 1-4-4z"/>
    </g>

    <!-- abacus -->
    <g transform="translate(126 364)">
      <rect x="0" y="0" width="30" height="26" rx="2"/><path d="M0 9h30M0 17h30"/>
      <circle cx="8" cy="5" r="2"/><circle cx="18" cy="13" r="2"/><circle cx="11" cy="21" r="2"/>
    </g>

    <!-- certificate -->
    <g transform="translate(210 364)">
      <rect x="0" y="0" width="30" height="22" rx="2"/><path d="M6 7h18M6 13h12"/>
      <circle cx="25" cy="18" r="4"/>
    </g>

    <!-- star -->
    <g transform="translate(300 366)">
      <path d="M12 0l3.6 7.6 8.4 1.1-6 5.8 1.4 8.3L12 18.9 4.6 22.8 6 14.5 0 8.7l8.4-1.1z"/>
    </g>

    <!-- scattered marks, to break the grid up -->
    <path d="M78 60c4-4 8-4 12 0"/>
    <path d="M356 60c4 4 8 4 12 0"/>
    <path d="M76 158h10M81 153v10"/>
    <path d="M232 160c5-3 9-3 14 0"/>
    <path d="M400 168c-4 3-8 3-12 0"/>
    <path d="M78 246c4 4 8 4 12 0"/>
    <path d="M162 258h10M167 253v10"/>
    <path d="M312 254c5-3 9-3 14 0"/>
    <path d="M84 336c4-4 8-4 12 0"/>
    <path d="M244 344h10M249 339v10"/>
    <path d="M390 340c-4 3-8 3-12 0"/>
    <path d="M170 60c-4 4-8 4-12 0"/>
  </g>
</svg>
