<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    The tab icon, derived from logo-lens.svg rather than copied from it.

    Thirteen bubbles is a hero logo, not a favicon: at 16px each one is under
    two pixels across and the glyphs inside them are nothing at all. What
    survives is the lens itself plus enough colour to say the full mark is a
    crowd of subjects — three bubbles, no glyphs, sized to still be visible
    when the whole icon is the width of a fingernail.
  -->
  <circle cx="27" cy="27" r="23" fill="#eef6f0"/>
  <circle cx="20.5" cy="22" r="7.5" fill="#c2542a"/>
  <circle cx="34" cy="19.5" r="6" fill="#2a5fa8"/>
  <circle cx="28" cy="35" r="8.5" fill="#0c6455"/>
  <circle cx="27" cy="27" r="23" fill="none" stroke="#0c6455" stroke-width="7"/>
  <path d="M44 44 L57 57" stroke="#3c2a33" stroke-width="9" stroke-linecap="round"/>
</svg>
